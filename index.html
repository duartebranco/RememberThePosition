<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Remember the Position</title>
        <link rel="icon" href="src/img/icon.png" />
        <link rel="stylesheet" href="src/css/chessboard-1.0.0.css" />
        <link rel="stylesheet" href="src/css/global.css" />
        <link rel="stylesheet" href="src/css/preferences.css" />

        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="src/js/chessboard-1.0.0.js"></script>

        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-M45LG1GETG"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-M45LG1GETG");
        </script>
    </head>
    <body>
        <!--- &#9812 --->
        <div id="title">Remember the Position<br />&#9812</div>

        <!-- Preferences Screen -->
        <div id="preferencesScreen" style="display: none">
            <button class="buttons" id="backButton"><- Back</button>
            <h2>Set Game's Preferences</h2>

            <div class="setting-group">
                <h3>Current ELO Rating: <span id="currentRating">1200</span></h3>

                <h3>Difficulty (by piece count):
                    <select id="difficultySelect" name="difficulty">
                        <option value="easy">Easy (&lt;4 pieces)</option>
                        <option value="normal" selected>Normal (5-7 pieces)</option>
                        <option value="hard">Hard (8+ pieces)</option>
                    </select>
                </h3>

                <h3>Time Limit:
                    <select id="timeLimitSelect" name="timeLimit">
                        <option value="60">Easy (60 seconds)</option>
                        <option value="30" selected>Normal (30 seconds)</option>
                        <option value="10">Hard (10 seconds)</option>
                    </select>
                </h3>
            </div>

            <button id="applySettings" class="game-button">
                Start Playing
            </button>
        </div>

        <!--- Chess Board --->
        <div id="board"></div>

        <!--- Buttons Container --->
        <div id="buttons-section">
            <button class="buttons" id="playBtn"><b>Play</b></button>
        </div>

        <!--- Footer --->
        <div id="textbox">
            <p>
                Made by
                <a href="https://github.com/duartebranco" target="_blank">me</a>
            </p>
        </div>
        <script src="src/js/script.js"></script>
        <script src="src/js/positions.js"></script>
    </body>
</html>
